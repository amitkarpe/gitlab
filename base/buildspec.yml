version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr-public get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin public.ecr.aws/l5q9p9n6
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - cd fedora
      - docker build -t public.ecr.aws/l5q9p9n6/lifebit/base:latest .
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push public.ecr.aws/l5q9p9n6/lifebit/base:latest
